AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

Layout/LineLength:
  Max: 120

# The SDK mirrors the gateway's own surface: long but flat resource classes, long but flat
# request/response tables. Length metrics measure the API, not the complexity of the code.
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
# The transport's retry/skew state machine and the envelope decoder branch once per documented
# protocol case; splitting them would hide the state machine rather than simplify it. Generated
# models grow initialize/from_h/to_h with the number of fields of their schema, not with the
# complexity of the code, so lib/oblodai/generated is outside these metrics.
Metrics/CyclomaticComplexity:
  Max: 14
  Exclude: ["lib/oblodai/generated/**/*"]
Metrics/PerceivedComplexity:
  Max: 15
  Exclude: ["lib/oblodai/generated/**/*"]
Metrics/MethodLength:
  Max: 40
  Exclude: ["lib/oblodai/generated/**/*"]
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/CollectionLiteralLength:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
Style/Documentation:
  Enabled: true
Style/ClassAndModuleChildren:
  Enabled: false
Naming/PredicatePrefix:
  Enabled: false
Naming/AccessorMethodName:
  Enabled: false

# Argument names are the API's own field names (q, ip).
Naming/MethodParameterName:
  AllowedNames: [a, b, io, id, to, ts, ok, q, ip]

# The wire vocabulary calls it `method` ("METHOD /path"), and these are plain value objects the
# SDK never reflects on — shadowing Struct#method keeps the code reading like the contract.
Lint/StructNewOverride:
  Exclude:
    - "lib/oblodai/core/route.rb"
    - "lib/oblodai/core/http.rb"
    - "lib/oblodai/core/request.rb"
    - "lib/oblodai/core/hooks.rb"
    - "spec/support/fake_http.rb"
